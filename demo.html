<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfficeKeeper 삭제 체험</title>
<style>
  :root{ --red:#e5372c; --green:#2e7d32; --sel:#cce8ff; --selb:#99d1ff; color-scheme:light; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1117}
  body{font-family:"Malgun Gothic","맑은 고딕","Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;color:#1a1a1a}
  button{font-family:inherit}

  /* ===== 무대 (1440×810 고정, 창 크기에 맞춰 축소·가운데) ===== */
  #app{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;overflow:hidden;user-select:none;
    background:
      radial-gradient(60% 70% at 72% 58%, rgba(140,200,255,.85) 0%, rgba(70,140,240,.55) 22%, rgba(20,70,170,0) 55%),
      radial-gradient(45% 55% at 30% 70%, rgba(90,120,255,.45) 0%, rgba(40,60,200,0) 60%),
      radial-gradient(80% 90% at 50% 40%, #1d5cc4 0%, #0e3a8f 45%, #071f52 100%);}
  #app::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(30% 22% at 66% 52%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%),
               conic-gradient(from 210deg at 70% 60%, rgba(255,255,255,0) 0deg, rgba(160,210,255,.25) 40deg, rgba(255,255,255,0) 90deg, rgba(120,170,255,.22) 160deg, rgba(255,255,255,0) 220deg);}

  /* 바탕화면 아이콘 */
  .dicons{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:18px}
  .dicon{width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .dicon i{width:42px;height:42px;display:block}

  /* ===== 작업 표시줄 ===== */
  .taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(238,242,248,.86);backdrop-filter:blur(18px);
    border-top:1px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;z-index:50}
  .tb-icons{display:flex;gap:4px}
  .tbi{width:40px;height:40px;border-radius:5px;display:grid;place-items:center;position:relative}
  .tbi[hidden]{display:none}
  .tbi:hover{background:rgba(255,255,255,.7)}
  .tbi.on::after{content:"";position:absolute;bottom:2px;left:50%;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:#0067c0}
  .tbi.open::after{content:"";position:absolute;bottom:2px;left:50%;width:6px;height:3px;margin-left:-3px;border-radius:2px;background:#8a8a8a}
  .tbi svg{width:24px;height:24px}
  .tray{position:absolute;right:8px;top:0;height:48px;display:flex;align-items:center;gap:2px;font-size:12px;color:#1a1a1a}
  .tray .t{padding:0 8px;text-align:right;line-height:1.35}
  .tray .ic{width:30px;height:36px;display:grid;place-items:center;border-radius:4px}
  .tray .ic svg{width:16px;height:16px}
  .reset{height:32px;border:0;background:transparent;border-radius:4px;display:flex;align-items:center;gap:5px;padding:0 9px;font-size:12px;cursor:pointer;color:#1a1a1a}
  .reset:hover{background:rgba(255,255,255,.8)}
  .reset svg{width:15px;height:15px}

  /* ===== 제어판 (프로그램 및 기능) ===== */
  .cp{position:absolute;left:96px;top:46px;width:1010px;height:652px;background:#fff;border:1px solid #6f8db8;
    box-shadow:0 18px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;z-index:10}
  .cp.inactive{border-color:#9aa3ad}
  .cp-title{height:32px;flex:none;display:flex;align-items:center;padding-left:10px;font-size:12px;background:#fff}
  .cp-title .ti{width:16px;height:16px;margin-right:8px}
  .cp-title .tt{flex:1}
  .cp.inactive .cp-title .tt{color:#888}
  .cp-title .wb{width:46px;height:32px;display:grid;place-items:center}
  .cp-title .wb svg{width:10px;height:10px}
  .cp-title .wb.x:hover{background:#e81123}.cp-title .wb.x:hover svg path{stroke:#fff}
  .cp-addr{height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid #e5e5e5}
  .nav{width:26px;height:26px;display:grid;place-items:center;color:#9a9a9a}
  .nav svg{width:14px;height:14px}
  .crumb{flex:1;height:26px;border:1px solid #d9d9d9;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12.5px;color:#222}
  .crumb svg{width:16px;height:16px}
  .crumb .sep{color:#777;font-size:10px}
  .srch{width:220px;height:26px;border:1px solid #d9d9d9;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:12px;color:#8a8a8a}
  .srch svg{width:13px;height:13px}
  .cp-body{flex:1;display:flex;min-height:0}
  .cp-side{width:206px;flex:none;padding:18px 0 0 22px;font-size:12.5px;line-height:1.5;background:#fff}
  .cp-side a{display:block;color:#1e5aa8;text-decoration:none;margin-bottom:10px}
  .cp-side a.sh{display:flex;gap:6px;align-items:flex-start}
  .cp-side a.sh svg{width:14px;height:14px;flex:none;margin-top:2px}
  .cp-main{flex:1;display:flex;flex-direction:column;min-width:0;padding-top:16px}
  .cp-main h1{margin:0 0 6px 18px;font-size:21px;font-weight:normal;color:#1e3287}
  .cp-main .desc{margin:0 0 12px 18px;font-size:12.5px;color:#333}
  .cp-tool{height:34px;flex:none;display:flex;align-items:center;gap:2px;padding:0 10px;background:linear-gradient(#fafbfd,#eef2f8);border-top:1px solid #dfe5ee;border-bottom:1px solid #dfe5ee;font-size:12.5px}
  .tool{height:26px;padding:0 10px;border:1px solid transparent;background:transparent;font-size:12.5px;color:#1a1a1a;display:flex;align-items:center;gap:4px;cursor:default}
  .tool.act{cursor:pointer}
  .tool.act:hover{background:#e5f1fb;border-color:#a8cdee}
  .tool[hidden]{display:none}
  .grid{flex:1;overflow:hidden;font-size:12.5px}
  .grid table{width:100%;border-collapse:collapse;table-layout:fixed}
  .grid th{font-weight:normal;text-align:left;color:#4c607a;height:28px;padding:0 8px;border-right:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5}
  .grid th:first-child{padding-left:12px}
  .grid td{height:26px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;border-left:0;border-right:0}
  .grid td:first-child{padding-left:10px;border-left:1px solid transparent}
  .grid td:last-child{border-right:1px solid transparent}
  .grid tbody tr{cursor:default}
  .grid tbody tr:hover td{background:#e5f3ff}
  .grid tbody tr.sel td{background:var(--sel);border-top-color:var(--selb);border-bottom-color:var(--selb)}
  .grid tbody tr.sel td:first-child{border-left-color:var(--selb)} .grid tbody tr.sel td:last-child{border-right-color:var(--selb)}
  .nm{display:flex;align-items:center;gap:8px}
  .ico{width:18px;height:18px;flex:none;border-radius:3px;display:grid;place-items:center;font-size:10px;font-weight:bold;color:#fff}
  .cp-info{height:66px;flex:none;border-top:1px solid #dfe5ee;background:linear-gradient(#f6f9fd,#e9f0f8);display:flex;align-items:center;gap:14px;padding:0 18px;font-size:12.5px;color:#333}
  .cp-info .big{width:44px;height:44px}
  .cp-info b{font-weight:normal;color:#5a6d86}
  .cp-info .k{display:grid;grid-template-columns:auto auto auto auto;column-gap:10px;row-gap:3px}

  /* 다음 동작 강조 */
  .hint-on .hint{animation:pulse 1.4s infinite}
  .hint-on tr.hint td{animation:rowpulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,196,0,.95)}70%{box-shadow:0 0 0 8px rgba(255,196,0,0)}100%{box-shadow:0 0 0 0 rgba(255,196,0,0)}}
  @keyframes rowpulse{0%,100%{background:#fff}50%{background:#fff3c4}}

  /* ===== 삭제 마법사 (원본 872×540) ===== */
  .win{position:absolute;left:284px;top:96px;width:872px;height:540px;background:#fff;border:1px solid #7a7a7a;box-shadow:0 22px 60px rgba(0,0,0,.5);
    display:flex;flex-direction:column;color:#1a1a1a;z-index:20;animation:pop .18s ease-out}
  .win[hidden]{display:none}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .titlebar{height:62px;flex:none;background:#5e5e5e;display:flex;align-items:center;padding-left:20px}
  .titlebar .logo{width:32px;height:32px;flex:none;display:block}
  .titlebar .t{flex:1;margin-left:10px;font-size:16.5px;font-weight:bold;color:#fff}
  .titlebar button{width:36px;height:36px;margin-right:2px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
  .titlebar button:last-child{margin-right:16px}
  .titlebar button:hover{background:#6e6e6e} .titlebar button.x:hover{background:#e81123}
  .wbody{flex:1;padding:26px 30px 0;overflow:hidden;position:relative}
  .wbody h2{margin:0 0 12px;font-size:21px;line-height:30px;font-weight:bold}
  .wbody p{margin:0;font-size:15px;line-height:1.55}
  .red{color:var(--red)}
  .gap-l{margin-top:22px}
  .warnbox{margin-top:22px;border:1px solid #f1b5b0;background:#fdeeee;padding:14px 18px}
  .warnbox .h{color:var(--red);font-weight:bold;font-size:15px;margin-bottom:6px}
  .warnbox ul{margin:0;padding:0;list-style:none}
  .warnbox li{color:var(--red);font-size:15px;line-height:1.7}
  .warnbox li::before{content:"• "}
  .prog{margin-top:58px;height:24px;border:1px solid #d0d0d0;background:#f2f2f2;overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:#0066cc}
  .prog.stop i{background:#6b7280}
  .status{display:flex;justify-content:space-between;gap:16px;margin-top:18px;font-size:15px;color:#666;white-space:nowrap}
  .status span:first-child{overflow:hidden;text-overflow:ellipsis}
  .dprog{margin-top:14px;height:20px;border:1px solid #a8a8a8;background:#fff;padding:2px}
  .dprog i{display:block;height:100%;width:0;background:#4d4d4d}
  .pct{margin-top:8px;font-size:14px;color:#333}
  .ulog{margin-top:8px;height:236px;border:1px solid #a8a8a8;overflow-y:auto;padding:4px 18px;font-size:14.5px;line-height:28.5px;color:#222}
  .radios{margin-top:30px;font-size:15px}
  .radios label{display:flex;align-items:center;gap:9px;margin-bottom:12px;cursor:pointer}
  .radios input{width:16px;height:16px;margin:0;accent-color:#0066cc}
  .chk{display:flex;align-items:center;gap:8px;margin-top:52px;font-size:15px;cursor:pointer}
  .chk input{width:17px;height:17px;margin:0}
  .pw{display:flex;align-items:center;margin-top:20px;font-size:15px}
  .pw label{width:127px}
  .pw input{width:358px;height:32px;border:1px solid #d6d6d6;border-bottom:2px solid #0066cc;font:inherit;font-size:15px;padding:0 10px;outline:none;user-select:text}
  .tbl{border:1px solid #8f8f8f;overflow:auto;font-size:14.5px}
  .tbl table{width:100%;border-collapse:collapse;table-layout:fixed}
  .tbl th{position:sticky;top:0;background:#fff;font-weight:normal;text-align:left;padding:7px 10px;border-right:1px solid #e3e3e3;z-index:1}
  .tbl td{padding:4px 10px;height:31px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbl td.r,.tbl th.r{text-align:right}
  .tbl tr:hover td{background:#eaf3fc}
  .tbl td.b{padding:4px 8px;text-overflow:clip}
  .tbl .open{width:134px;height:24px;font:inherit;font-size:14px;background:#fdfdfd;border:1px solid #adadad;border-radius:2px;cursor:pointer}
  .tbl .open:hover{background:#e5f1fb;border-color:#0078d4}
  .stats{display:flex;gap:16px;margin:18px 0 18px}
  .stats div{flex:1;height:46px;border:1px solid #cfcfcf;border-radius:4px;display:grid;place-items:center;font-size:15.5px}
  .stats .a{color:#8a8a8a} .stats .s{color:var(--green);font-weight:bold} .stats .f{color:#d32f2f;font-weight:bold}
  .wfoot{height:68px;flex:none;background:#f0f0f0;border-top:1px solid #dcdcdc;display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:0 28px}
  .btn{width:206px;height:33px;font:inherit;font-size:15px;background:#fdfdfd;border:1px solid #adadad;border-radius:3px;cursor:pointer;color:#1a1a1a}
  .btn:hover{background:#e5f1fb;border-color:#0078d4}
  .btn.primary{border:2px solid #0066cc}
  .btn:disabled{color:#a6a6a6;background:#f6f6f6;border-color:#dadada;cursor:default}
  .btn:disabled.hint{animation:none}

  /* 알림 · 재시작 화면 */
  .toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:rgba(32,32,32,.9);color:#fff;font-size:13.5px;
    padding:9px 16px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:60}
  .toast.on{opacity:1}
  .reboot{position:absolute;inset:0;background:#0a59c4;color:#fff;display:grid;place-items:center;z-index:80;font-size:22px}
  .reboot[hidden]{display:none}
  .reboot .in{display:flex;flex-direction:column;align-items:center;gap:26px}
  .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app" class="hint-on">

  <div class="dicons">
    <div class="dicon"><i><svg viewBox="0 0 42 42"><rect x="6" y="9" width="30" height="24" rx="2" fill="#dfe9f7"/><rect x="9" y="12" width="24" height="16" fill="#3a8ee6"/><rect x="16" y="33" width="10" height="3" fill="#b8c6d8"/></svg></i>내 PC</div>
    <div class="dicon"><i><svg viewBox="0 0 42 42"><path d="M11 12h20l-2 24H13z" fill="#e8eef5"/><rect x="9" y="8" width="24" height="4" rx="1" fill="#c9d5e3"/><path d="M17 17v15M21 17v15M25 17v15" stroke="#b3c0cf" stroke-width="1.6"/></svg></i>휴지통</div>
  </div>

  <!-- 제어판 -->
  <section class="cp" id="cp">
    <div class="cp-title">
      <svg class="ti" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="11" rx="1" fill="#3d8be0"/><rect x="3" y="4" width="10" height="7" fill="#cfe5fb"/><path d="M5 14h6" stroke="#6b7c90" stroke-width="1.5"/></svg>
      <span class="tt">프로그램 및 기능</span>
      <span class="wb"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="#222"/></svg></span>
      <span class="wb"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="#222"/></svg></span>
      <span class="wb x"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10" stroke="#222"/></svg></span>
    </div>
    <div class="cp-addr">
      <span class="nav"><svg viewBox="0 0 14 14"><path d="M13 7H2M6 3 2 7l4 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>
      <span class="nav"><svg viewBox="0 0 14 14"><path d="M1 7h11M8 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>
      <span class="nav"><svg viewBox="0 0 14 14"><path d="M7 13V2M3 6l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>
      <div class="crumb"><svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="11" rx="1" fill="#3d8be0"/><rect x="3" y="4" width="10" height="7" fill="#cfe5fb"/></svg>
        <span class="sep">›</span>제어판<span class="sep">›</span>프로그램<span class="sep">›</span>프로그램 및 기능</div>
      <div class="srch">프로그램 및 기능 검색<svg viewBox="0 0 13 13"><circle cx="5.5" cy="5.5" r="4.3" fill="none" stroke="#777" stroke-width="1.3"/><path d="m8.6 8.6 3.6 3.6" stroke="#777" stroke-width="1.3"/></svg></div>
    </div>
    <div class="cp-body">
      <nav class="cp-side">
        <a>제어판 홈</a>
        <a>설치된 업데이트 보기</a>
        <a class="sh"><svg viewBox="0 0 14 14"><path d="M1 2l6-1v6H1zM8 .8 13 0v7H8zM1 8h6v6l-6-1zM8 8h5v6l-5-.8z" fill="#1f6fd1"/></svg>Windows 기능 켜기/끄기</a>
      </nav>
      <div class="cp-main">
        <h1>프로그램 제거 또는 변경</h1>
        <p class="desc">프로그램을 제거하려면 목록에서 선택한 후 [제거], [변경] 또는 [복구]를 클릭하십시오.</p>
        <div class="cp-tool">
          <span class="tool">구성 ▾</span>
          <button class="tool act" id="uninstBtn" hidden>제거/변경</button>
        </div>
        <div class="grid">
          <table>
            <colgroup><col><col style="width:200px"><col style="width:96px"><col style="width:76px"><col style="width:130px"></colgroup>
            <thead><tr><th>이름</th><th>게시자</th><th>설치 날짜</th><th>크기</th><th>버전</th></tr></thead>
            <tbody id="plist"></tbody>
          </table>
        </div>
        <div class="cp-info" id="cpInfo"></div>
      </div>
    </div>
  </section>

  <!-- 삭제 마법사 -->
  <div class="win" id="win" hidden></div>

  <div class="toast" id="toast"></div>
  <div class="reboot" id="reboot" hidden><div class="in"><div class="spin"></div>다시 시작하는 중</div></div>

  <!-- 작업 표시줄 -->
  <div class="taskbar">
    <div class="tb-icons">
      <span class="tbi"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="9.5" height="9.5" rx="1" fill="#1f6fd1"/><rect x="12.5" y="2" width="9.5" height="9.5" rx="1" fill="#1f6fd1"/><rect x="2" y="12.5" width="9.5" height="9.5" rx="1" fill="#1f6fd1"/><rect x="12.5" y="12.5" width="9.5" height="9.5" rx="1" fill="#1f6fd1"/></svg></span>
      <span class="tbi"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="#333" stroke-width="1.8"/><path d="m15 15 6 6" stroke="#333" stroke-width="1.8"/></svg></span>
      <span class="tbi open"><svg viewBox="0 0 24 24"><path d="M2 6h8l2 2h10v12H2z" fill="#f2b632"/><path d="M2 10h20v10H2z" fill="#ffd25c"/></svg></span>
      <span class="tbi on" id="tbCp"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="1.5" fill="#3d8be0"/><rect x="4" y="6" width="16" height="10" fill="#cfe5fb"/><path d="M8 21h8" stroke="#6b7c90" stroke-width="2"/></svg></span>
      <span class="tbi" id="tbOk" hidden><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9.6" fill="#5e5e5e"/><path d="M14.6 7.2 A5.4 5.4 0 1 0 15.2 11.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M7.3 10.2 L9.3 12.1 L12.9 8.3" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <div class="tray">
      <button class="reset" id="resetBtn" title="처음부터 다시"><svg viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4" fill="none" stroke="#333" stroke-width="1.5"/><path d="M4.5 1.2v3.3H1.2" fill="none" stroke="#333" stroke-width="1.5"/></svg>처음부터</button>
      <span class="ic"><svg viewBox="0 0 16 16"><path d="M3 10l5-5 5 5" fill="none" stroke="#333" stroke-width="1.4"/></svg></span>
      <span class="ic" style="font-size:12px">한</span>
      <span class="ic"><svg viewBox="0 0 16 16"><path d="M1 6a10 10 0 0 1 14 0M3.5 8.6a6.4 6.4 0 0 1 9 0M6 11.2a2.8 2.8 0 0 1 4 0" fill="none" stroke="#333" stroke-width="1.3"/><circle cx="8" cy="13.4" r="1" fill="#333"/></svg></span>
      <span class="ic"><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z" fill="#333"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4" fill="none" stroke="#333" stroke-width="1.2"/></svg></span>
      <span class="t" id="clock"></span>
    </div>
  </div>

function render(){
  $('win').innerHTML = titlebar() + VIEWS[state]();
  const pwd=$('pwd'), agree=$('agree'), go=$('goBtn');
  const setGo = on => { go.disabled=!on; go.classList.toggle('primary',on); go.previousElementSibling.classList.toggle('primary',!on); };
  if(pwd){ pwd.addEventListener('input',()=>setGo(!!pwd.value)); setTimeout(()=>pwd.focus(),50); }
  if(agree) agree.addEventListener('change',()=>setGo(agree.checked));
}
function go(s){ clearInterval(timer); state=s; render(); RUN[s] && RUN[s](); }
function animate(ms, from, onTick, onEnd){
  const t0=performance.now()-from*ms;
  timer=setInterval(()=>{ const p=Math.min(1,(performance.now()-t0)/ms); onTick(p); if(p>=1){clearInterval(timer); onEnd();} },50);
}
const RUN = {
  scan:()=> animate(6000, scanP, p=>{
      scanP=p; $('bar').style.width=(p*100)+'%';
      $('cnt').textContent=`검사한 파일 ${fmt(scanned())} · 발견 ${foundSoFar()}건`;
    }, ()=> go('found')),
  decrypt:()=> animate(4500, 0, p=>{
      const n=Math.floor(FOUND*p); $('bar').style.width=(p*100)+'%';
      $('cur').textContent='해제 중: '+files[Math.min(n,FOUND-1)].path; $('cnt').textContent=`${n} / ${FOUND}`;
    }, ()=> go('result')),
  uninstall:()=>{
    const L=[[5,'프로그램 설치 여부가 확인되었습니다.'],[11,'에이전트 삭제 정보 전송이 완료되었습니다.'],[17,'시스템 환경설정이 설치 전 상태로 복원되었습니다.'],
      [23,'서비스가 성공적으로 종료되었습니다.'],[30,'서비스 등록 해제가 완료되었습니다.'],[36,'서비스 등록 해제가 완료되었습니다.'],
      [42,'컨텍스트 메뉴 등록이 해제되었습니다.'],[50,'플러그인 삭제가 완료되었습니다.'],[57,'서브모듈 삭제가 완료되었습니다.'],

      if(msg){ const d=document.createElement('div'); d.textContent=msg; $('ulog').append(d); $('ulog').scrollTop=1e6; }
      if(k>=L.length){ clearInterval(timer); timer=setTimeout(()=>go('done'),700); }
    },420);
  }
};

let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1800); }

  skipNow:()=>{ skipCount=0; go('uninstall'); },
  stopScan:()=> go('stopped'),
  resumeScan:()=> go('scan'),
  stopToSkip:()=>{ skipCount=foundSoFar(); skipBack='stopped'; go('skip'); },
  toPassword:()=> go('password'),
  toDecrypt:()=> go('decrypt'),
  foundToSkip:()=>{ skipCount=FOUND; skipBack='found'; go('skip'); },
  resultToSkip:()=>{ skipCount=failed.length; skipBack='result'; go('skip'); },
  openLoc:()=> toast('탐색기에서 파일 위치를 엽니다.'),
  recheck:()=> toast(`재확인 결과: 실패 ${failed.length}건 그대로입니다.`),
  back:()=> go(state==='password' ? 'found' : skipBack),
  toUninstall:()=> go('uninstall'),
  close:()=>{ if(['decrypt','uninstall'].includes(state)) return; closeWizard(); },
  finish:()=>{
    const now = (document.querySelector('input[name=rb]:checked')||{}).value==='now';
    installed=false; selected=null; closeWizard();
    if(now){ $('reboot').hidden=false; setTimeout(()=>{ $('reboot').hidden=true; },2600); }
  },
  none:()=>{}
};
$('win').addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(b && !b.disabled) A[b.dataset.act](); });

function reset(){
  clearInterval(timer); clearTimeout(timer); scanP=0; skipCount=0; selected=null; installed=true;
  $('reboot').hidden=true; closeWizard();
}
$('resetBtn').addEventListener('click', reset);

/* 시계 */
function tick(){
  const d=new Date(), h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0');
  $('clock').innerHTML = `${h<12?'오전':'오후'} ${(h%12)||12}:${m}<br>${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
tick(); setInterval(tick, 10000);

/* 창 크기에 맞춰 축소 · 가운데 */
function fit(){
  const app=$('app'), W=1440, H=810;
  const s=Math.min(innerWidth/W, innerHeight/H, 1);
  app.style.transform=`translate(${Math.max(0,(innerWidth-W*s)/2)}px,${Math.max(0,(innerHeight-H*s)/2)}px) scale(${s})`;
}
addEventListener('resize', fit); fit();
renderList();
</script>
</body>
