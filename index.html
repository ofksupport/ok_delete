<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfficeKeeper 에이전트 삭제 체험</title>
<style>
  :root{color-scheme:light dark;--bg:#fff;--line:#e3e5e8;--tx:#37352f;--sub:#787774;--hov:#f7f7f5;--ac:#2383e2;--ac2:#1a6fc9;--tile:#eaf3fc}
  @media (prefers-color-scheme:dark){:root{--bg:#252525;--line:#373737;--tx:#e6e6e5;--sub:#9b9b9b;--hov:#2c2c2c;--tile:#1f3448}}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;overflow:hidden}
  body{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;padding:4px 2px}
  a.card{display:flex;align-items:center;gap:14px;max-width:560px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--tx);text-decoration:none;transition:background .15s,border-color .15s}
  a.card:hover{background:var(--hov);border-color:var(--ac)}
  .tile{width:44px;height:44px;flex:none;border-radius:10px;background:var(--tile);display:grid;place-items:center}
  .tile svg{width:24px;height:24px}
  .tx{flex:1;min-width:0}
  .tx b{display:block;font-size:15px;line-height:1.35}
  .tx span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
  .go{flex:none;height:34px;padding:0 14px;border-radius:7px;background:var(--ac);color:#fff;font-size:13.5px;font-weight:bold;display:flex;align-items:center;gap:6px}
  a.card:hover .go{background:var(--ac2)}
  .go svg{width:13px;height:13px}
</style>
</head>
<body>
<a class="card" id="card" href="demo.html" target="_blank" rel="noopener">
  <span class="tile"><svg viewBox="0 0 24 24"><path d="M5 3.5 19 12 5 20.5z" fill="#2383e2"/></svg></span>
  <span class="tx"><b>OfficeKeeper 에이전트 삭제 체험</b><span>실제 PC에는 영향이 없는 모의 화면이에요</span></span>
  <span class="go">체험하기<svg viewBox="0 0 13 13"><path d="M4 1.5h7.5V9M11.5 1.5 2 11" fill="none" stroke="#fff" stroke-width="1.8"/></svg></span>
</a>
<script>
/* 체험 화면을 알맞은 크기의 새 창(팝업)으로 열고, 팝업이 막히면 새 탭으로 엽니다 */
const POP_W = 1240, POP_H = 740;
document.getElementById('card').addEventListener('click', e => {
  const sw = screen.availWidth || 1280, sh = screen.availHeight || 800;
  const w = Math.min(POP_W, sw - 40), h = Math.min(POP_H, sh - 40);
  const l = (screen.availLeft || 0) + Math.max(0, (sw - w) / 2), t = (screen.availTop || 0) + Math.max(0, (sh - h) / 2);
  const win = window.open(e.currentTarget.href, 'okUninstallDemo', `popup=yes,width=${w},height=${h},left=${l},top=${t}`);
  if (win) { e.preventDefault(); try { win.focus(); } catch (_) {} }
});
</script>
</body>
</html>
